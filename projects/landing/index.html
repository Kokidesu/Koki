<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Koki — Apps</title>
<style>
  :root { --bg:#0f1226; --panel:#1a1f3a; --border:#2c3360; --text:#eef1ff; --muted:#9aa3c7; --accent:#6c8cff; --accent2:#46d6b6; }
  *{box-sizing:border-box;} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;background:radial-gradient(1200px 600px at 20% -10%,#1d2350,var(--bg) 55%) fixed;color:var(--text);min-height:100vh;}
  .wrap{max-width:720px;margin:0 auto;padding:48px 16px;}
  h1{text-align:center;margin:0 0 6px;}
  p.sub{text-align:center;color:var(--muted);margin:0 0 28px;}
  a.card{display:block;text-decoration:none;color:var(--text);background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:14px;transition:.15s;}
  a.card:hover{border-color:var(--accent);transform:translateY(-2px);}
  a.card h2{margin:0 0 6px;font-size:1.15rem;}
  a.card .emoji{font-size:1.6rem;margin-right:8px;}
  a.card p{margin:0;color:var(--muted);font-size:.9rem;}
  footer{text-align:center;color:var(--muted);font-size:.8rem;margin-top:24px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Koki — Apps</h1>
  <p class="sub">学習・対策用Webアプリ / Study & prep web apps</p>

  <a class="card" href="./photo-tutor/">
    <h2><span class="emoji">📸</span>写真で学ぶ AI 家庭教師</h2>
    <p>問題の写真をアップ → 答えと解説を日英で。図形・グラフ対応。学習・復習用。</p>
  </a>

  <a class="card" href="./case-interview/">
    <h2><span class="emoji">💼</span>ケース面接ドリル</h2>
    <p>全コンサル対応のケース面接練習Webアプリ。</p>
  </a>

  <a class="card" href="./vr-boyfriend/">
    <h2><span class="emoji">🫶</span>みーくん — VR彼氏</h2>
    <p>るーちゃん専用のやさしい彼氏アプリ。いこいこモード（いい子いい子）付き。</p>
  </a>

  <footer>学習・対策目的のツールです。</footer>
</div>
</body>
</html>
