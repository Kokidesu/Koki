name: Deploy apps to GitHub Pages

# projects 配下の各Webアプリを1つの GitHub Pages サイトにまとめて公開する。
# 公開URL: https://kokidesu.github.io/koki/
#   - トップ:         /              (projects/landing)
#   - 写真AI家庭教師:  /photo-tutor/  (projects/photo-tutor)
#   - ケース面接:      /case-interview/ (projects/case-interview)

on:
  push:
    branches: [ "main" ]
    paths:
      - "projects/landing/**"
      - "projects/photo-tutor/**"
      - "projects/case-interview/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r projects/landing/. _site/
          mkdir -p _site/photo-tutor
          cp -r projects/photo-tutor/. _site/photo-tutor/
          mkdir -p _site/case-interview
          cp -r projects/case-interview/. _site/case-interview/

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
